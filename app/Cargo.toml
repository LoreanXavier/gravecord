[package]
name = "gravecord"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# Offscreen frame capture for the parity harness. Pulls in gpui's test support, so it stays out of normal builds.
capture = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
uuid.workspace = true
zeroize.workspace = true
dc-gateway.workspace = true
dc-hotkey.workspace = true
dc-auth.workspace = true
dc-http.workspace = true
dc-markdown.workspace = true
dc-media.workspace = true
dc-proto.workspace = true
dc-detect.workspace = true
dc-state.workspace = true
dc-tokens.workspace = true
dc-voice.workspace = true
dc-webhost.workspace = true
gpui = { path = "../vendor/zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_platform = { path = "../vendor/zed/crates/gpui_platform" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
md-5 = "0.10"
# Standard stickers are Lottie JSON (module 148355 draws them with lottie-web); rasterlottie (MIT OR Apache-2.0) draws
# them on the CPU, as Serein does (DECISIONS.md).
rasterlottie = { version = "=0.2.2", default-features = false }
openh264.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tts = "0.26"
wuff = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
embed-resource = "3"
