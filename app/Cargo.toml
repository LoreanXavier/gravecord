[package]
name = "gravecord"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Offscreen frame capture for the parity harness. Pulls in gpui's test support, so it stays out of normal builds.
# The call simulator (`callsim` harness steps, app/src/ui/callsim.rs) comes with it.
capture = ["gpui/test-support", "gpui_platform/test-support", "dep:dc-callsim"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
uuid.workspace = true
zeroize.workspace = true
rand.workspace = true
percent-encoding = "2"
dc-clips.workspace = true
dc-callsim = { path = "../crates/dc-callsim", optional = true }
dc-gateway.workspace = true
dc-hotkey.workspace = true
dc-intl.workspace = true
dc-auth.workspace = true
dc-http.workspace = true
dc-markdown.workspace = true
dc-overlay.workspace = true
dc-media.workspace = true
dc-release = { path = "../crates/dc-release" }
ed25519-dalek = "2.2"
dc-proto.workspace = true
dc-rpc.workspace = true
dc-detect.workspace = true
dc-state.workspace = true
dc-tokens.workspace = true
dc-voice.workspace = true
dc-webhost.workspace = true
dc-webauthn.workspace = true
gpui = { path = "../vendor/zed/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_platform = { path = "../vendor/zed/crates/gpui_platform" }
crc32fast = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif"] }
md-5 = "0.10"
# The update setup file is verified against the SHA-256 in the feed (updater.rs).
sha2 = "0.10"
# Standard stickers are Lottie JSON (module 148355 draws them with lottie-web); rasterlottie (MIT OR Apache-2.0) draws
# them on the CPU, as Serein does (DECISIONS.md).
rasterlottie = { version = "=0.2.2", default-features = false }
# The ClearURLs plugin runs the ClearURLs project's rules (plugins/clear_urls.rs); both crates are already in the tree.
regex = "1"
openh264.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tts = "0.26"
url.workspace = true
# Styled display names (Nitro name effects) are drawn from glyph outlines: ttf-parser (MIT OR Apache-2.0, already pulled in by
# gpui) reads the outlines, tiny-skia (BSD-3-Clause, already pulled in by rasterlottie) fills and strokes them.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
resvg = { version = "0.46", default-features = false }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
# ZipPreview inflates archives (already in the lock through reqwest).
flate2 = "1"
# MoreCommands' /transform normal forms (already in the lock through other crates).
unicode-normalization = "0.1"
wuff = "0.2"
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Power"] }

[build-dependencies]
embed-resource = "3"
