[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
dc-setup = { path = "../crates/dc-setup" }
dc-release = { path = "../crates/dc-release" }
# The local Discord of `cargo xtask replay` / `perf --replay`: ETF packing, the gateway's zstd stream, its WebSocket.
dc-proto = { path = "../crates/dc-proto" }
tungstenite = "0.28"
zstd.workspace = true
ed25519-dalek = "2.2"
rand.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }
