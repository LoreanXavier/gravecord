[package]
name = "dc-media"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Camera and screen capture, H.264 encoding and decoding, and system-audio capture. No network and no Discord code.
# Adapted from Serein's discord-voice and platform crates (MIT OR Apache-2.0). The OS calls live
# in the `#![allow(unsafe_code)]` modules under camera/, screen/, encode/ and decode/, so everything else stays safe.

[features]
# Simulated devices for the call simulator (crates/dc-callsim): test pictures instead of cameras and screens.
sim = []

[dependencies]
openh264.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
