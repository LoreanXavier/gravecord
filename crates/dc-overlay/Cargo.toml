[package]
name = "dc-overlay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# The game overlay: the decision of when it shows (OverlayRenderStore, RunningGameStore), its persisted settings
# (OverlayStoreV2, OverlayStore6, OverlaySettingsStore, LayoutStore), the voice widget's maths, and on Windows the
# out-of-process window's styles and the foreground watcher.

[dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
