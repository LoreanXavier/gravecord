[workspace]
resolver = "3"
members = ["app", "crates/*", "xtask"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
iana-time-zone = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "brotli", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
dc-gateway = { path = "crates/dc-gateway" }
dc-markdown = { path = "crates/dc-markdown" }
dc-state = { path = "crates/dc-state" }
dc-tokens = { path = "crates/dc-tokens" }
dc-http = { path = "crates/dc-http" }
dc-proto = { path = "crates/dc-proto" }

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 1

# Same revisions as vendor/zed/Cargo.toml: gpui is built and tested against these forks.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
