[workspace]
resolver = "3"
members = ["app", "crates/*", "xtask"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/LoreanXavier/gravecord"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
iana-time-zone = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "brotli", "zstd", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
# CLDR plural categories and number formatting for the message formatter (crates/dc-intl): what the official client
# gets from the browser's Intl.PluralRules and Intl.NumberFormat (ICU/CLDR), here from ICU4X's compiled CLDR data.
icu_plurals = "2"
icu_decimal = "2"
icu_locale_core = "2"
icu_provider = { version = "2", features = ["sync"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
# Voice, at Serein's pins (vendor/serein/crates/discord-voice/Cargo.toml); aes-gcm at the version Serein's lockfile resolves.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
cpal = { version = "=0.18.2", default-features = false }
davey = { version = "=0.1.4", default-features = false }
openmls = { version = "=0.8.1", default-features = false }
opus2 = { version = "=0.4.0", default-features = false, features = ["backend-libopus", "static", "bundled"] }
rtrb = "=0.4.0"
# H.264 software encoder and decoder (dc-media), at Serein's pin.
openh264 = "=0.9.8"
# The official UI sounds are mp3 (module 696354): crates/dc-voice/src/sound.rs decodes them with Symphonia (MPL-2.0).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac", "isomp4", "aac"] }
# Microphone processing (crates/dc-voice/src/process.rs): Sonora, a pure Rust port of WebRTC audio processing
# (BSD-3-Clause); DeepFilterNet 3 through libDF on tract (MIT OR Apache-2.0), with its bundled model; the FFT and
# arrays libDF uses.
sonora = { version = "=0.2.0", default-features = false }
# WebRTC's RNN voice detector and its SIMD backend, from the same port: the automatic input sensitivity.
sonora-agc2 = "=0.2.0"
sonora-simd = "=0.2.0"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# libDF builds against tract 0.21.4 (its own lockfile); 0.21.10 dropped `symbol_table` and moved to another ndarray.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
realfft = "3"
url = "2"
unicode-normalization = "0.1"
zeroize = "1.8"
dc-auth = { path = "crates/dc-auth" }
dc-detect = { path = "crates/dc-detect" }
dc-gateway = { path = "crates/dc-gateway" }
dc-clips = { path = "crates/dc-clips" }
dc-hotkey = { path = "crates/dc-hotkey" }
dc-intl = { path = "crates/dc-intl" }
dc-markdown = { path = "crates/dc-markdown" }
dc-state = { path = "crates/dc-state" }
dc-tokens = { path = "crates/dc-tokens" }
dc-http = { path = "crates/dc-http" }
dc-media = { path = "crates/dc-media" }
dc-proto = { path = "crates/dc-proto" }
dc-rpc = { path = "crates/dc-rpc" }
dc-voice = { path = "crates/dc-voice" }
dc-webhost = { path = "crates/dc-webhost" }
dc-webauthn = { path = "crates/dc-webauthn" }
dc-winaudio = { path = "crates/dc-winaudio" }

[profile.dev]
debug = "limited"
incremental = false

[profile.test]
incremental = false

[profile.dev.package."*"]
opt-level = 1

# The sticker player renders Lottie frames in real time, even in debug builds.
[profile.dev.package.rasterlottie]
opt-level = 3
[profile.dev.package."tiny-skia@0.12.0"]
opt-level = 3
[profile.dev.package."tiny-skia-path@0.12.0"]
opt-level = 3

# The voice processors run in real time even in debug builds.
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
# tract-core's debug assertions reject DeepFilterNet 3's graph ("duplicate name /convt3/Conv.bias").
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-pulse]
opt-level = 3
[profile.dev.package.tract-pulse-opl]
opt-level = 3
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.dc-voice]
opt-level = 3
# The clip editor converts and scales decoded pictures in real time, even in debug builds.
[profile.dev.package.dc-clips]
opt-level = 3
# RSA-2048 key generation for the QR login, in debug builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# Same revisions as vendor/zed/Cargo.toml: gpui is built and tested against these forks.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
